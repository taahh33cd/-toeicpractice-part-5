<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TOEIC Grammar</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>
  <div class="app-container">

    <div class="screens-wrapper">
      
      <!-- ========================================================= -->
      <!-- MÀN HÌNH CHÍNH (HOME) - PHONG CÁCH MINIMALISM HIỆN ĐẠI  -->
      <!-- ========================================================= -->
      <div id="home-screen" class="screen active">
        <!-- MICRO HEADER MỚI CỦA TRANG CHỦ -->
        <header class="micro-header">
          <div class="logo">TOEIC.Grammar</div>
        </header>

        <div class="home-wrapper">
          <!-- HERO SECTION -->
          <section class="hero-section">
            <button id="btn-random-test" class="btn-hero">LUYỆN TẬP NGẪU NHIÊN</button>
            <p class="hero-subtitle">Hệ thống sẽ bốc 1 bài Test ngẫu nhiên để khởi động.</p>
            
            <div class="time-settings-minimal">
              <label>Thời lượng:</label>
              <select id="time-select">
                <option value="10">10 Phút</option>
                <option value="15">15 Phút</option>
                <option value="20" selected>20 Phút</option>
                <option value="0">Không giới hạn</option>
              </select>
            </div>
          </section>

          <!-- TOPIC LIST (ACCORDION) -->
          <section class="topics-section">
            <h3 class="section-title">CHUYÊN ĐỀ NGỮ PHÁP</h3>
            <div id="topics-list-container" class="topics-accordion">
              <!-- JS Render Accordion Items -->
            </div>
          </section>
        </div>
      </div>


      <!-- ========================================================= -->
      <!-- MÀN HÌNH THI (TEST) - GIAO DIỆN GỐC BAN ĐẦU              -->
      <!-- ========================================================= -->
      <div id="test-screen" class="screen">
        <header class="test-header">
          <div id="test-header-title">TOEIC Reading - Part 5</div>
          <div class="timer" id="test-timer">10:00</div>
        </header>

        <div class="test-layout">
          <main class="test-main">
            <div class="question-container">
              <div class="question-number" id="question-number-display">Question <span id="current-q-index">1</span> of <span id="total-q-count">20</span></div>
              <p class="question-text" id="question-text">Loading question...</p>
              <div class="options-group" id="options-group">
                <!-- Rendered via JS -->
              </div>
            </div>

            <div class="test-controls">
              <button id="prev-btn" class="secondary-btn">← Trở lại</button>
              <button id="next-btn" class="secondary-btn">Tiếp theo →</button>
            </div>
          </main>

          <aside class="test-sidebar">
            <div class="sidebar-title">Danh sách câu hỏi</div>
            <div class="question-grid" id="question-grid">
              <!-- Grid Buttons Rendered Via JS -->
            </div>
            <button id="submit-btn" class="submit-btn">Nộp Bài</button>
          </aside>
        </div>
      </div>


      <!-- ========================================================= -->
      <!-- MÀN HÌNH KẾT QUẢ (REVIEW) - GIAO DIỆN GỐC               -->
      <!-- ========================================================= -->
      <div id="review-screen" class="screen">
        <div class="review-card">
          <h2>Hoàn Thành!</h2>
          <div class="score-display">
            <span id="score-correct">0</span> / <span id="score-total">0</span>
          </div>
          <p class="score-text">Số đáp án chính xác</p>

          <div class="review-grid" id="review-grid">
            <!-- Grid Buttons Rendered Via JS -->
          </div>

          <button id="restart-btn" class="primary-btn mt-20">VỀ TRANG CHỦ</button>
        </div>
      </div>

      <!-- MODAL GIẢI THÍCH CHI TIẾT - GIAO DIỆN GỐC -->
      <div id="explanation-modal" class="modal">
        <div class="modal-content">
          <span class="close-btn" id="close-modal">&times;</span>
          <h3 id="modal-q-number" class="modal-title">Question</h3>
          <p id="modal-q-text" class="modal-q-text"></p>

          <div class="modal-options" id="modal-options">
            <!-- Hiển thị đáp án đúng/sai -->
          </div>

          <div class="explanation-sections">
            <div class="exp-section">
              <h4>Lý do chọn</h4>
              <p id="modal-reason"></p>
            </div>
            <div class="exp-section">
              <h4>Ngữ pháp</h4>
              <p id="modal-grammar"></p>
            </div>
            <div class="exp-section">
              <h4>Dịch nghĩa</h4>
              <p id="modal-translation"></p>
            </div>
            <div class="exp-section">
              <h4>Từ vựng</h4>
              <ul id="modal-vocabulary"></ul>
            </div>
          </div>
        </div>
      </div>

    </div> <!-- Close screens-wrapper -->
  </div>

  <script src="data/questions.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
